<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MurettoStudio – anteprime serie 2</title>
<style>
  :root { --ink:#2b2622; --muted:#7a6f66; --line:#e6ded5; --bg:#faf7f3; --ok:#2f7d4f; --wait:#b5711b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.45rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  .box { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 18px; }
  .box h2 { font-size:1.15rem; margin:0 0 2px; }
  .meta { color:var(--muted); font-size:.9rem; margin:0 0 12px; }
  .gal { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 12px; }
  .gal figure { margin:0; }
  .gal img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:zoom-in; display:block; }
  .gal img.alto { object-fit:contain; }
  .gal figcaption { font-size:.78rem; color:var(--muted); margin-top:3px; }
  .check { margin:0; padding-left:20px; }
  .check li { margin:0 0 6px; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; margin:4px 0 12px; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  td.n { text-align:right; white-space:nowrap; }
  .tag { display:inline-block; font-size:.78rem; font-weight:600; padding:2px 9px; border-radius:99px; }
  .tag.ok { background:#e3f2e8; color:var(--ok); }
  .tag.wait { background:#fbefdc; color:var(--wait); }
  .domanda { background:#fff8ec; border-left:4px solid var(--wait); padding:10px 12px; border-radius:6px; margin-top:10px; }
  .nota { font-size:.85rem; color:var(--muted); }
  #zoom { position:fixed; inset:0; background:rgba(20,16,12,.92); display:none; align-items:center; justify-content:center; z-index:9; }
  #zoom.on { display:flex; }
  #zoom img { max-width:100vw; max-height:100vh; object-fit:contain; }
</style>
</head>
